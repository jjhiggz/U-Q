name: ${UQ_COMPOSE_PROJECT:-uq}

services:
  postgres:
    image: postgres:16-alpine
    labels:
      com.uq.app: "true"
      com.uq.service: "postgres"
    environment:
      POSTGRES_USER: musicqueue
      POSTGRES_PASSWORD: musicqueue
      POSTGRES_DB: musicqueue
    ports:
      - "${UQ_DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicqueue"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
